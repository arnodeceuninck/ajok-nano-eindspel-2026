title: Ninja
description: Raak de hand van je tegenstander in één vloeiende beweging!
details: |
  Iedereen staat in een kring en neemt een 'ninja-houding' aan.
  Om de beurt mag een speler in één vloeiende beweging proberen de hand of arm van een buurman te raken.
  De verdediger mag ook in één vloeiende beweging ontwijken.
  Na de actie bevries je meteen in je nieuwe houding — niet meer bewegen!
  Word je op een hand of arm geraakt? Dan valt die arm eruit.
  Verlies je beide armen? Dan val je af.
  De laatste ninja wint!
