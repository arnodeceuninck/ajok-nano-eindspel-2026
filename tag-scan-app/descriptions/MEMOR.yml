title: Memory
description: Vind alle kaartenpaartjes door je geheugen te gebruiken!
details: |
  Leg alle kaarten omgekeerd (beeldkant naar beneden) neer op een vlakke ondergrond.
  Om de beurt draait een speler twee kaarten om.
  Als de twee kaarten een paartje vormen, mag je ze houden en nog een keer spelen.
  Als ze niet overeenkomen, draai je beide kaarten terug om.
  Wie de meeste paartjes heeft als alle kaarten weg zijn, wint!

  Tip: hou goed bij waar de kaarten liggen die je al hebt gezien.
