title: Memory
description: Vind alle kaartparen door ze te onthouden!
details: |
  Leg alle kaarten omgekeerd op tafel of op de grond.
  Duid een kaart aan en draai die om.
  Draai daarna een tweede kaart om.
  Zijn de twee kaarten hetzelfde? Dan mogen ze open blijven liggen.
  Zo niet, draai ze dan terug om — en probeer het te onthouden voor later!
  Het doel is om alle kaartparen te vinden.
  Wie vindt de meeste paren?

  Benodigdheden: memory spel
