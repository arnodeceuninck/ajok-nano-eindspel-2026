title: Tikkertje Stopcontact
description: Word bevrijd door het menselijk stopcontact!
details: |
  Gewoon tikkertje, maar met een twist!
  Word je getikt? Dan zet je je beide handen op je heupen: jij bent nu het 'stopcontact'.
  Je staat stil en kan niet meer rennen.
  Iemand anders kan jou bevrijden door met hun twee armen door jouw stopcontact te gaan.
  De tikker probeert zoveel mogelijk mensen tegelijk bevroren te houden.
  Wie is er tikker als de tijd om is?
