title: Tekenwedstrijd
description: Teken iets van het kamp in 5 minuten — de groep stemt!
details: |
  De begeleider kiest een onderwerp (zie suggesties hieronder).
  Iedereen tekent hetzelfde onderwerp, elk op zijn eigen blaadje.
  Je hebt precies 5 minuten.
  Daarna legt iedereen zijn tekening neer.
  De groep stemt voor de mooiste OF grappigste tekening (begeleider beslist de categorie).
  De winnaar mag het volgende onderwerp kiezen!

  Suggesties voor onderwerpen:
  - Het kampveld vanuit de lucht
  - Jouw kampgenoot als superheld
  - Het grappigste kampmoment
  - Een dier dat ook op kamp is
  - De begeleider als cartoon
