title: Kegelvoetbal
description: Gooi de kegels van anderen om met een bal!
details: |
  Iedereen kiest zijn eigen locatie en zet twee kegels ondersteboven neer.
  Spelers proberen elkaars kegels om te gooien door een bal te rollen of te gooien.
  Regel: je moet minstens 5 stappen verwijderd zijn van een kegel om die te mogen omgooien.
  Worden jouw kegels omgegooid? Dan lig je eruit!
  Wie als laatste zijn kegels overeind heeft staan, wint.

  Benodigdheden: kegels (2 per speler), bal
