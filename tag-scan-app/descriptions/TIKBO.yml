title: Tik Tak Boem
description: Geef de bom snel door — wie hem houdt als de tijd om is, valt af!
details: |
  De begeleider bedenkt een categorie (bijv. "dieren met 4 poten").
  De eerste speler houdt de "bom" (een bal, knuffel of ander voorwerp).
  Je mag de bom pas doorgeven als je iets in de categorie hebt gezegd.
  Wie de bom vasthoudt als de begeleider "BOEM!" roept, valt af.
  De overgeblevene begint de volgende ronde met een nieuwe categorie.

  Categorievoorbeelden:
  - Landen in Europa
  - Dingen in een slaapzak
  - Superhelden
  - Dingen op het kampterrein
  - Woorden die eindigen op -jes

  Tip: de begeleider telt in gedachten af en roept "BOEM!" op een onverwacht moment.
