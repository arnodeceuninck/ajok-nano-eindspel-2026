title: Tik-tak-boem
description: Geef de bom door voor die ontploft!
details: |
  Iedereen staat in een kring.
  Eén persoon zit in het midden, sluit de ogen en zegt luidop: "tik-tak, tik-tak, tik-tak..."
  De mensen in de kring geven ondertussen de bal snel door aan elkaar.
  Op een willekeurig moment roept de persoon in het midden ineens "BOEM!"
  Wie op dat moment de bal vasthoudt, valt af.
  Ga door tot er één persoon overblijft.

  Benodigdheden: bal (de 'bom')
