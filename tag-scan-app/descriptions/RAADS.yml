title: Logische Raadsels
description: Los samen een reeks wiskundige en logische puzzels op!
details: |
  De begeleider stelt de raadsels één voor één voor.
  Werk samen als groep om de oplossingen te vinden.
  Geef jullie antwoord als groep — overleg is toegestaan!
  Wie de meeste juiste antwoorden geeft, wint.

  Voorbeelden van raadsels:
  - Ik heb steden zonder huizen, bossen zonder bomen, water zonder vissen.
    Wat ben ik? (Een kaart)
  - Een boer heeft 17 schapen. Alle behalve 9 sterven. Hoeveel zijn er over? (9)
  - Wat gaat op 4 benen 's morgens, 2 benen 's middags, 3 benen 's avonds? (De mens)
  - Maak van 8 8 8 8 = 500 met enkel plus-tekens. (888 + 88 + 8 + 8 + 8)

  Tip: de begeleider kan ook eenvoudige rekenpuzzels bedenken op maat van de groep.
