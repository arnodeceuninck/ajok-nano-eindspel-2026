title: Alle Vogels Vliegen
description: Vlieg mee als het dier kan vliegen, anders blijf je doodstil!
details: |
  Iedereen staat in een kring en trommelt zachtjes met de handen op de bovenbenen.
  De moni roept steeds: "[Diernaam] vliegen!"
  Kan het dier vliegen (bijv. "De mussen vliegen!")? Dan moet iedereen vliegbewegingen maken.
  Kan het dier niet vliegen (bijv. "De olifanten vliegen!")? Dan houden de handen stijf op de benen.
  Wie per ongeluk toch vliegt (of stil blijft bij een echte vogel), valt af of krijgt een tegenprestatie.
  Hoe snel kan de moni je foppen?
