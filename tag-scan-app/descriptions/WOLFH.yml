title: Wolfje, Hoe Laat Is Het?
description: Sluip dichterbij de wolf... maar pas op voor etenstijd!
details: |
  Iedereen ("de geiten") start op een lijn achteraan.
  De wolf staat met zijn rug naar hen toe tegen een muur.
  De groep roept samen: "Wolfje, wolfje, hoe laat is het?"
  De wolf zegt een getal, bijvoorbeeld "3 uur" — iedereen zet dan 3 stappen vooruit.
  Dit herhaalt zich, totdat de wolf ineens "ETENSTIJD!" roept.
  Dan draait de wolf zich om en jaagt op de geiten.
  De eerste geit die getikt wordt, is de nieuwe wolf!
