title: Omgekeerd Verstoppertje
description: Eén persoon verstopt zich — de rest zoekt en kruipt er stilletjes bij!
details: |
  Ook wel "Sardientjes" genoemd!
  Slechts één persoon gaat zich verstoppen.
  De rest sluit de ogen en telt tot 50.
  Daarna gaat iedereen individueel op zoek.
  Vind je de verstopplek? Zeg of verklap dan niets — kruip er stilletjes bij!
  Langzaam zit de hele groep als sardines in een blik op dezelfde plek.
  Het spel eindigt als de allerlaatste persoon hen vindt.
