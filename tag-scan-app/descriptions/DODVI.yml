title: Dode Vis
description: Wie kan het langst roerloos de "dode vis" spelen?
details: |
  Iedereen gaat op de grond liggen als een dode vis — zo stil en levensloos mogelijk.
  Lachen, bewegen, knipperen of geluid maken is verboden!
  De begeleider probeert de groep aan het lachen te krijgen door grappige dingen te zeggen of te doen.
  Wie beweegt of lacht, is eruit.
  Wie als laatste nog steeds de perfecte dode vis speelt, wint!

  Tip voor de begeleider: kriebel, vertel grappige verhalen of maak gekke geluiden.
  Raak de spelers echter niet aan.
