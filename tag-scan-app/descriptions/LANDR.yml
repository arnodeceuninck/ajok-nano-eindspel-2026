title: Land zonder R en I
description: Noem landen, steden of plaatsen zonder de letters R en I te gebruiken!
details: |
  Iedereen zegt om de beurt een land, stad of dorp.
  De naam mag geen R en geen I bevatten (hoofdletters of kleine letters).
  Wie een naam zegt mét R of I, valt af.
  Wie niets kan bedenken binnen 5 seconden, valt ook af.
  Wie als laatste overblijft, wint het spel!

  Tip voor de begeleider: tel mee op je vingers of gebruik een timer.
