title: Land van Genernogie
description: Ontdek welke voorwerpen mee mogen naar het land van Genernogie!
details: |
  Dit is een raadselspel. De kinderen zeggen telkens een voorwerp.
  De moni laat weten of dat voorwerp wel of niet mee mag naar het land van Genernogie.

  Het geheim: alleen voorwerpen zonder de letters 'r' of 'i' mogen mee!
  Voorbeelden die mee mogen: schoen, pet, tas, bed, stoel.
  Voorbeelden die niet mee mogen: paraplu, drinkbus, fiets, dieren.

  Tip voor de moni: onthoud de regel zelf goed, maar verklap hem niet!
  Het spel eindigt als iedereen de regel heeft ontdekt.
