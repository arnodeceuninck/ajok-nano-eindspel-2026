title: Zin Doorfluisteren
description: Fluister een zin door en zie hoe hij verandert!
details: |
  Alle deelnemers staan op een rij.
  De moni fluistert een lange zin in het oor van de eerste persoon.
  Die fluistert de zin door aan de volgende — slechts één keer, niet herhalen!
  Zo gaat het verder tot de laatste persoon.
  De laatste persoon zegt de zin dan luidop.
  Vergelijk met de originele zin — vaak met grappige resultaten!

  Voorbeeldzin: "Aliens kunnen schatten verstoppen over heel de planeet, maar er zijn
  altijd mensen die sterker zijn dan de aliens en de code tot de schat kunnen ontcijferen."
