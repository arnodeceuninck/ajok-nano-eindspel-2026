title: Zin Doorzeggen
description: Fluister een zin door en kijk hoe hij verandert!
details: |
  De begeleider fluistert een lange, ingewikkelde zin in het oor van de eerste speler.
  Die fluistert de zin door aan de volgende — slechts één keer, niet herhalen!
  Zo gaat het verder tot de laatste speler.
  De laatste speler zegt hardop wat hij gehoord heeft.
  Vergelijk met de originele zin — vaak met grappige resultaten!

  Tip voor de begeleider: gebruik een mooie, verwarrende zin zoals:
  "De paarse olifant met groene vlekken sprong over de regenboogbrug terwijl
  hij een sandwich at met extra mosterd en drie augurken."

  Speel meerdere rondes met steeds een andere beginstarter.
