title: Doolhof
description: Vind de weg van start tot finish in het doolhof!
details: |
  Iedereen krijgt een papier met een doolhof.
  Teken een weg van start tot finish zonder op een muur te botsen.
  Er zijn verschillende moeilijkheidsgraden beschikbaar — kies je uitdaging!
  Wie het doolhof oplost, mag een moeilijker exemplaar proberen.

  Benodigdheden: papieren met doolhoven (verschillende moeilijkheidsgraden), pen
