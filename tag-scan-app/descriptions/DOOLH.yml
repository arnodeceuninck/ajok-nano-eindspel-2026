title: Doolhof
description: Los het doolhof zo snel mogelijk op!
details: |
  De begeleider geeft jullie het doolhofblad en een pen.
  Vind samen de weg van het begin tot de uitgang.
  Je mag de pen van het papier tillen, maar ga niet door muren!
  Werk samen: iemand houdt het papier, iemand tekent, iemand kijkt mee.
  De begeleider stopt de tijd — probeer het zo snel mogelijk te doen!

  Tip: begin met het verkennen van doodlopende wegen en elimineer ze.
  Of werk van de uitgang terug naar het begin.
