title: Parkourtje
description: Bouw samen een parcours en doorloop het zo snel en feilloos mogelijk!
details: |
  Bouw met de groep een parcours van obstakels in de omgeving.
  Gebruik wat je vindt: takken, stenen, stoelen, touw...
  Elk teamlid loopt het parcours één keer.
  Wie het parcours het snelst en zonder fouten doorloopt, wint!
  Jullie mogen het parcours ook samen als groep lopen als uitdaging.

  Voorbeelden van obstakels:
  - Balanceer op een balk
  - Kruip onder een touw door
  - Ren zigzag tussen paaltjes
  - Spring over een obstakel
