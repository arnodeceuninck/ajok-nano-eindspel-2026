title: Woord-Estafette
description: Bouw samen een verhaal op, één woord per keer!
details: |
  Iedereen zit in een kring.
  De moni begint een verhaal met slechts één woord (bijv. "Er").
  De volgende persoon zegt het volgende woord ("vloog"), de derde vult aan ("een"), enzovoort.
  Het doel is om in razend tempo een grammaticaal kloppend verhaal te bouwen —
  of een super bizar verhaal, dat mag ook!
  Wie te lang aarzelt of een woord zegt waarmee de zin vastloopt,
  valt af of moet een gekke actie uitvoeren.
