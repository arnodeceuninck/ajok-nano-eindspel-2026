title: Iemand Is Hem
description: Gooi de bal om anderen uit te schakelen!
details: |
  De spelers gaan verspreid klaar staan.
  De leiding gooit een bal in de groep.
  Wie de bal oppakt, mag proberen een ander speler af te gooien met de bal.
  Word je geraakt door de bal? Dan ga je aan de kant.
  Als er drie spelers aan de kant staan, mag de eerste van die drie weer meedoen.
  Het spel gaat door tot er nog maar één iemand over is.

  Benodigdheden: bal
