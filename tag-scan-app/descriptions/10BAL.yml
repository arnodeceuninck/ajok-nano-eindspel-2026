title: 10 Baltoetsen
description: Raak de bal 10 keer achter elkaar aan zonder dat hij op de grond valt!
details: |
  Gebruik je hoofd, voeten, knieën, schouders of handen — alles mag!
  Alle teamleden mogen samenwerken en de bal doorgeven.
  Als de bal de grond raakt, begin je opnieuw bij 0.
  Bereik 10 aanrakingen achter elkaar om dit spel te voltooien.
