title: Tienbal
description: Hou de bal 10 keer (of meer) in de lucht!
details: |
  Probeer samen de bal minstens 10 keer in de lucht te houden zonder dat hij op de grond valt.
  Alle teamleden mogen meehelpen: gebruik hoofd, handen, voeten, knieën — alles mag!
  Als de bal op de grond valt, begin je opnieuw bij 0.

  Uitbreiding: verdeel de groep in twee teams en probeer de bal van elkaar af te pakken.

  Benodigdheden: bal
