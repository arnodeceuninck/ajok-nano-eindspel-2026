title: Brief Schrijven
description: Schrijf een brief aan jezelf die je over een jaar leest!
details: |
  Schrijf een brief (of maak een tekening) aan jezelf, bedoeld om over een jaar te lezen.
  Schrijf daarin onder andere:
    - Wat je allemaal leuk vond aan het kamp deze week
    - Grappige momenten of mooie herinneringen
    - Je dromen of wensen voor het komende jaar

  Vouw de brief op, schrijf je naam erop en bewaar hem goed.

  Benodigdheden: papier, pen of potlood
