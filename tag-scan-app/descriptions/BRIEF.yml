title: Brief over het Kamp
description: Schrijf samen een brief over jullie kampbeleving!
details: |
  Schrijf als groep een brief aan iemand thuis (ouders, vriend, huisdier...).
  De brief moet minstens een halve bladzijde zijn.

  Denk aan:
  - Wat vonden jullie het leukste moment tot nu toe?
  - Welk grappig voorval is er geweest?
  - Wat hebben jullie geleerd of ontdekt?
  - Wie zijn nieuwe vrienden geworden?
  - Wat missen jullie van thuis?

  Zorg dat iedereen minstens één zin bijdraagt.
  Tip: lees de brief daarna hardop voor aan de begeleider.
