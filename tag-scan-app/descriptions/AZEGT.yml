title: Alien Zegt
description: Doe enkel een beweging als iemand "Alien zegt ..." zegt!
details: |
  Zoals "Simon Zegt", maar dan met een alien-twist!
  De leider geeft opdrachten, zoals: "Alien zegt: spring op één been!"
  Iedereen voert de opdracht uit — maar alleen als de leider eerst "Alien zegt" zei.
  Zegt de leider de opdracht zonder "Alien zegt"? Dan mag je niets doen.
  Wie toch beweegt, valt af!
  Wie het langst stand houdt zonder fouten, wint.
