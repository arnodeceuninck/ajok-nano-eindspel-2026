title: Tikkertje Standbeeld
description: Word bevrijd als iemand door je benen kruipt!
details: |
  Eén of twee tikkers proberen de rest te tikken.
  Word je getikt? Dan bevries je meteen in een grappige standbeeldbouding met je benen wijd.
  Je kunt alleen worden verlost als een vrije speler dapper tussen je benen door kruipt.
  Het spel is afgelopen als iedereen bevroren is, of als de tikkers na 5 minuten doodop zijn.
