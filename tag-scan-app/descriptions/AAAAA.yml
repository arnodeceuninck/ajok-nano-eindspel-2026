title: Tikkertje AAAAA
description: Tikkertje, maar je mag enkel lopen wanneer je AAAAA zegt!
details: |
  Gewoon tikkertje, maar met één belangrijke regel:
  Je mag alleen lopen als je luidop "AAAAA!" zegt.
  Stop je met zeggen? Dan moet je ook stoppen met lopen.
  De tikker moet ook aan de regel houden.
  Wie getikt wordt, wordt de nieuwe tikker.
