title: Pictionary
description: Teken een woord en laat de rest raden wat het is!
details: |
  De moni zegt stiekem een woord tegen één deelnemer.
  Die persoon begint het woord te tekenen — geen letters, cijfers of gebarentaal!
  De rest probeert zo snel mogelijk te raden wat het getekende woord is.
  Wie het correct raadt, mag het volgende woord tekenen.
  Speel meerdere rondes met steeds andere woorden.

  Benodigdheden: pen, papier
