title: Pang Pang
description: Buig snel of schiet de traagste eruit!
details: |
  Iedereen staat in een kring. De moni staat in het midden.
  De moni draait rond, wijst plots naar iemand en roept "PANG!"
  Die persoon moet zo snel mogelijk bukken.
  De twee personen links en rechts van de gebukte persoon moeten naar elkaar wijzen en "PANG!" roepen.
  De traagste van die twee valt af. Wie vergeet te bukken, valt ook af.

  Finale: de laatste twee staan rug aan rug, zetten een afgesproken aantal stappen,
  draaien zich dan om en roepen "PANG!" naar elkaar.
  De snelste wint!
