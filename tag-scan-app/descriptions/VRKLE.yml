title: Onherkenbaar Verkleden
description: Verklee je zo goed mogelijk zodat niemand je herkent!
details: |
  Iedereen heeft 5 minuten om zich zo onherkenbaar mogelijk te verkleden.
  Gebruik kleding, sjaals, hoeden, brillen, schmink, bladeren... wees creatief!
  Na 5 minuten beoordeelt de begeleider wie het meest onherkenbaar is.
  De meest onherkenbare persoon wint het spel!

  Ideeën:
  - Keer je trui binnenstebuiten
  - Doe een muts of sjaal om je hoofd
  - Maak een masker van papier
  - Gebruik modder of verf als schmink
  - Trek het grootste kledingstuk van het kamp aan

  Tip: maak een foto van het resultaat als herinnering!
