title: Ik ga op reis...
description: Het klassieke geheugenspel — onthoud de steeds langere reislijst!
details: |
  De eerste speler zegt: "Ik ga op reis en ik neem mee: een [iets]."
  De volgende herhaalt de zin EN voegt een nieuw item toe aan het einde.
  Zo gaat het verder: elke speler herhaalt alles en voegt iets toe.

  Wie iets vergeet of in de verkeerde volgorde zegt, valt af.
  Wie als laatste overblijft zonder fouten, wint!

  Regels:
  - Je mag de vorige speler niet helpen.
  - Elk nieuw item moet anders zijn dan de vorige.
  - Bij twijfel beslist de begeleider.
