title: Achteruit Lopen
description: Loop een parcours achteruit zonder te struikelen!
details: |
  Loop een parcours op het kampterrein achteruit af.
  Zet eventueel obstakels of objecten uit om omheen te lopen.
  Pas op dat je niet struikelt of botst!
  Wie doet het parcours het snelst?

  Benodigdheden: optioneel een parcours of objecten om omheen te lopen
