title: Achteruitlopen
description: Loop een volledig rondje achterwaarts rond het kampveld!
details: |
  Alle teamleden starten op dezelfde plek.
  Loop samen achteruitwaarts een volledig rondje rond het kampveld.
  Niemand mag omdraaien of omvallen!
  Jullie mogen elkaar helpen en waarschuwen voor obstakels.
  Het rondje is voltooid als iedereen terug op de startplek staat.

  Regels:
  - Omdraaien = spel opnieuw beginnen
  - Omvallen = begeleider beslist of het rondje opnieuw moet
  - Jullie mogen in een rij of naast elkaar lopen
