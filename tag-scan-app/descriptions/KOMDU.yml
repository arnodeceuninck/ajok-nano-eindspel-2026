title: Komisch Duo
description: Ontdek wie je bent en zoek je wederhelft!
details: |
  Iedereen krijgt een post-it op het voorhoofd geplakt met een bekende naam.
  Alle namen zijn beroemde duo's:
    bijv. SpongeBob & Patrick, Suske & Wiske, Mario & Luigi, Peper & Zout.

  Iedereen loopt rond en mag aan anderen alleen ja/nee-vragen stellen om te ontdekken wie ze zijn.
  Zodra je weet wie je bent, zoek je zo snel mogelijk je 'wederhelft' in de groep.
  Als je je partner gevonden hebt, gaan jullie samen op de grond zitten.
  Wie vindt zijn duo het snelst?

  Benodigdheden: post-its, pen
