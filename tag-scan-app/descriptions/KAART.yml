title: Kaartenhuisje
description: Bouw samen een kaartenhuisje van minstens 3 verdiepingen hoog!
details: |
  Gebruik gewone speelkaarten (de begeleider heeft ze bij zich).
  Het huisje moet minstens 3 verdiepingen hoog zijn.
  Je mag met z'n allen samenwerken.
  Het huisje moet minstens 5 seconden zelfstandig blijven staan.
  Waaier of blaas niet tegen het huisje!

  Tip: begin met een stabiele basis en bouw rustig verder omhoog.
  Buig de kaarten lichtjes voor meer stabiliteit.
