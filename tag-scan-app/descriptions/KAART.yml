title: Kaartenhuisje
description: Bouw zo hoog mogelijk een kaartenhuisje!
details: |
  Gebruik een gewoon boek speelkaarten om een kaartenhuisje te bouwen.
  Probeer het zo hoog mogelijk te maken.
  Stapel voorzichtig, want het kan snel instorten!
  Wie bouwt het hoogste kaartenhuisje?

  Benodigdheden: boek speelkaarten
