title: Ik Neem Mee
description: Onthoud een steeds langere reeks voorwerpen!
details: |
  Iedereen zit of staat in een kring.
  De eerste speler zegt: "Ik ga op reis en ik neem mee: [voorwerp]."
  De tweede speler herhaalt dit en voegt een extra voorwerp toe.
  Elk volgend persoon herhaalt de volledige lijst en voegt een eigen voorwerp toe.
  Wie de volgorde vergeet of een voorwerp overslaat, valt af.
  Hoe lang kan de groep de reeks bijhouden?
