title: Levend Steen Schaar Papier
description: Speel steen-schaar-papier als heel team en tik het verliezende team!
details: |
  Verdeel de groep in twee teams.
  Elk team trekt zich even terug om stiekem één symbool te kiezen:
    - Steen  = gehurkt zitten met gebalde vuisten
    - Papier = armen wijd gespreid
    - Schaar = armen gekruist voor de borst

  De teams staan tegenover elkaar.
  Op het signaal van de moni laat iedereen tegelijk het gekozen symbool zien.
  Steen wint van Schaar — Schaar wint van Papier — Papier wint van Steen.
  Het verliezende team rent hard terug naar hun achterlijn.
  Het winnende team probeert hen te tikken voor ze de lijn bereiken.
  Getikte spelers wisselen van team.
  Speel meerdere rondes!
